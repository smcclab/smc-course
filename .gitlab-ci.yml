image: ruby:2.7.1

page-build:
  tags:
    - Pages
  stage: build
  script:
    - bundle install
    - bundle exec jekyll build -d /srv/gitlab-ce-pages/staging/$CI_PIPELINE_ID/$CI_BUILD_REF_NAME/$CI_PROJECT_PATH
  only:
    - master

page-test:
  tags:
    - Pages
  stage: test
  script:
    - htmlproofer --alt-ignore "/style.anu.edu.au/" --file-ignore "/404/" --assume-extension /srv/gitlab-ce-pages/staging/$CI_PIPELINE_ID/$CI_BUILD_REF_NAME/$CI_PROJECT_PATH
  only:
    - master
  allow_failure: true

page-deploy:
  tags:
  - Pages
  stage: deploy
  script:
    - mkdir -p /srv/gitlab-ce-pages/staging/$CI_BUILD_ID/$CI_BUILD_REF_NAME/`dirname $CI_PROJECT_PATH`
    - mv /srv/gitlab-ce-pages/staging/$CI_PIPELINE_ID/$CI_BUILD_REF_NAME/$CI_PROJECT_PATH /srv/gitlab-ce-pages/staging/$CI_BUILD_ID/$CI_BUILD_REF_NAME/$CI_PROJECT_PATH
    - rm -rf /srv/gitlab-ce-pages/staging/$CI_PIPELINE_ID
  only:
    - master
