# Jekyll (http://jekyllrb.com/) uses the information in this file to
# figure out how to generate your website

# for more info on these configuration variables (and more) see
# https://jekyllrb.com/docs/configuration/

# this is a YAML file - for more info on YAML syntax then Ansible's docs have a
# decent explanation: http://docs.ansible.com/ansible/latest/YAMLSyntax.html

#############
# Site Info #
#############

# sub-path of your site (/courses/COMPXXXX)
baseurl: ""

# the base hostname & protocol for your site (generally leave as-is)
url: ""

#######################
# Theme Configuration #
#######################
cecs:
  # site name (in words, e.g. the full course name)
  title: Long Title

  # short site name (e.g. COMPXXXX)
  short_title: Short Title

  # your name and email in here
  page_contact: Lecturer Name
  page_contact_email: lecturer.name@anu.edu.au

  # These are for the standard ANU Footer
  responsible_officer: Head of School
  responsible_officer_email: head.cs@cecs.anu.edu.au

  # Configuration for the "News" sidebar which shows up if your site has any posts.
  news:
    sidebar_length: 3 # how many posts to show in the sidebar
    view_more_url: '/news' # where to point people who want to see the rest of the posts

  news: true
  news_sidebar_length: 3

  # populate the menu with links to related sites
  # (feel free to delete the existing ones as well)
  related_sites:
    - name: CS Homepage
      url: https://cs.anu.edu.au
    - name: GitLab
      url: https://gitlab.cecs.anu.edu.au
    - name: Streams
      url: https://cs.anu.edu.au/streams
    - name: Current students
      url: http://www.anu.edu.au/study

collections:
  lectures:
    show_in_navbar: true
    output: true
    display-order: 1
    permalink: /lectures/:path/
  labs:
    show_in_navbar: true
    output: true
    display-order: 2
    permalink: /labs/:path/
  deliverables:
    show_in_navbar: true
    output: true
    output: true
    display-order: 3
    permalink: /deliverables/:path/
  resources:
    show_in_navbar: true
    output: true
    display-order: 4
    permalink: /resources/:path/

##################
# build settings #
##################

# files/folders to exclude from the build process
# these ones are already excluded by default anyway, but they're here as an example
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

theme: jekyll-theme-cecs

plugins:
  - jekyll-plugins-cecs

sass:
  style: compressed

# default layouts for different pages
defaults: 
  - 
    scope: 
      path: ""
    values: 
      layout: default
  - 
    scope: 
      path: _posts
    values: 
      categories: news
      show_date: true
      show_time: true

permalink: /:categories/:year/:month/:day/:title/

