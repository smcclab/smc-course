<ul class="post-list">
  {% for post in site.[page.collection] %}
    {% if include.filter == null or post.url contains include.filter %}
      {% if post.url != page.url %}
        {% include postitem.html post=post last=forloop.last hidedate=include.hidedate showtime=include.showtime %}
      {% endif %}
    {% endif %}
  {% endfor %}
</ul>
